apply plugin: 'com.android.application'
apply from: '../../../../../Platforms/Android/common.gradle'

android {
    ndkVersion "16.1.4479499"
    signingConfigs {
        DavaTest {
            keyAlias 'test'
            keyPassword 'qazwsx'
            storeFile file('../../../../../Platforms/Android/DavaTest.keystore')
            storePassword 'qazwsx'
        }
    }
    defaultConfig {
        applicationId 'com.dava.uiviewer'
        externalNativeBuild.cmake.arguments '-DUNITY_BUILD=True'
    }
    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
    buildTypes {
        release {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.DavaTest
        }
    }
}

dependencies {
    implementation project(':DavaEngine')
    implementation project(':DavaEngine:ModuleSound')
}
